<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payments | ParkEase Admin</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/admin-dashboard.css" />
  </head>
  <body>
    <div id="adminSidebarMount"></div>
    <div class="dashboard-wrapper">
      <header class="topbar">
        <button
          class="mobile-menu"
          id="mobileMenu"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title">
          <span>PARKEASE ADMINISTRATION</span>
          <h1 id="pageTitle">Payments</h1>
        </div>
        <div class="topbar-actions">
          <div class="admin-profile">
            <div class="admin-avatar">A</div>
            <div>
              <strong id="adminName">Administrator</strong
              ><small>System Admin</small>
            </div>
          </div>
        </div>
      </header>
      <main class="dashboard-main">
        <section>
          <div class="section-top">
            <div>
              <span>PAYMENT MANAGEMENT</span>
              <h2>Payments</h2>
              <p>Payment records attached to active parking tickets.</p>
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon green">
                <i class="bi bi-cash-stack"></i>
              </div>
              <div class="stat-info">
                <span>Cash Payments</span
                ><strong id="cashPayments">GHS 0.00</strong>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon blue">
                <i class="bi bi-credit-card"></i>
              </div>
              <div class="stat-info">
                <span>Online Payments</span
                ><strong id="onlinePayments">GHS 0.00</strong>
              </div>
            </div>
          </div>
          <div class="dashboard-card">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Payment ID</th>
                    <th>Ticket</th>
                    <th>Method</th>
                    <th>Amount</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="paymentTable">
                  <tr>
                    <td colspan="5" class="empty-table">Loading payments...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/parking-data.js"></script>
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-pages.js"></script>
  </body>
</html>
