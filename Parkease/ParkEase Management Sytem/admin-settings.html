<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | ParkEase Admin</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/admin-dashboard.css" />
  </head>
  <body>
    <div id="adminSidebarMount"></div>
    <div class="dashboard-wrapper">
      <header class="topbar">
        <button
          class="mobile-menu"
          id="mobileMenu"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title">
          <span>PARKEASE ADMINISTRATION</span>
          <h1 id="pageTitle">Settings</h1>
        </div>
        <div class="topbar-actions">
          <div class="admin-profile">
            <div class="admin-avatar">A</div>
            <div>
              <strong id="adminName">Administrator</strong
              ><small>System Admin</small>
            </div>
          </div>
        </div>
      </header>
      <main class="dashboard-main">
        <section>
          <div class="section-top">
            <div>
              <span>SYSTEM</span>
              <h2>Settings</h2>
              <p>Current facility configuration.</p>
            </div>
          </div>
          <form
            class="dashboard-card settings-card settings-form"
            id="systemSettingsForm"
          >
            <div class="setting-row">
              <div>
                <strong>Parking Capacity</strong>
                <p>Total spaces configured for this facility.</p>
              </div>
              <strong class="setting-value">100 spaces</strong>
            </div>
            <div class="setting-row">
              <div>
                <strong>Parking Rate</strong>
                <p>Standard parking charge per hour.</p>
              </div>
              <label class="setting-control" for="hourlyRate">
                <span>GHS</span>
                <input
                  id="hourlyRate"
                  name="hourlyRate"
                  type="number"
                  min="0.01"
                  step="0.01"
                  required
                />
                <span>/ hour</span>
              </label>
            </div>
            <div class="setting-row">
              <div>
                <strong>Payment Methods</strong>
                <p>Accepted payment methods.</p>
              </div>
              <div class="setting-methods">
                <label><input type="checkbox" id="enableCash" /> Cash</label>
                <label
                  ><input type="checkbox" id="enableOnline" disabled />
                  Online (gateway required)</label
                >
              </div>
            </div>
            <div class="settings-actions">
              <p id="settingsFeedback" role="status" aria-live="polite"></p>
              <button class="btn-primary" type="submit">
                <i class="bi bi-check-lg"></i> Save Settings
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/parking-data.js"></script>
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-pages.js"></script>
  </body>
</html>
