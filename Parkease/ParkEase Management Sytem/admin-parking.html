<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parking Spaces | ParkEase Admin</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/admin-dashboard.css" />
  </head>
  <body>
    <div id="adminSidebarMount"></div>
    <div class="dashboard-wrapper">
      <header class="topbar">
        <button
          class="mobile-menu"
          id="mobileMenu"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title">
          <span>PARKEASE ADMINISTRATION</span>
          <h1 id="pageTitle">Parking Spaces</h1>
        </div>
        <div class="topbar-actions">
          <div class="admin-profile">
            <div class="admin-avatar">A</div>
            <div>
              <strong id="adminName">Administrator</strong
              ><small>System Admin</small>
            </div>
          </div>
        </div>
      </header>
      <main class="dashboard-main">
        <section>
          <div class="section-top">
            <div>
              <span>PARKING MANAGEMENT</span>
              <h2>Parking Spaces</h2>
              <p>Live status for all 100 spaces.</p>
            </div>
          </div>
          <div class="full-parking-grid" id="fullParkingGrid"></div>
        </section>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/parking-data.js"></script>
    <script src="js/admin-dashboard.js"></script>
  </body>
</html>
