<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports | ParkEase Admin</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/admin-dashboard.css" />
  </head>
  <body>
    <div id="adminSidebarMount"></div>
    <div class="dashboard-wrapper">
      <header class="topbar">
        <button
          class="mobile-menu"
          id="mobileMenu"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title">
          <span>PARKEASE ADMINISTRATION</span>
          <h1 id="pageTitle">Reports</h1>
        </div>
        <div class="topbar-actions">
          <div class="admin-profile">
            <div class="admin-avatar">A</div>
            <div>
              <strong id="adminName">Administrator</strong
              ><small>System Admin</small>
            </div>
          </div>
        </div>
      </header>
      <main class="dashboard-main">
        <section>
          <div class="section-top">
            <div>
              <span>ANALYTICS</span>
              <h2>Parking Activity</h2>
              <p>Current activity from active parking sessions.</p>
            </div>
          </div>
          <div class="reports-grid">
            <div class="dashboard-card report-card">
              <i class="bi bi-car-front-fill"></i><span>VEHICLES PARKED</span
              ><strong id="reportVehicles">0</strong>
            </div>
            <div class="dashboard-card report-card">
              <i class="bi bi-ticket-perforated-fill"></i
              ><span>ACTIVE TICKETS</span><strong id="reportTickets">0</strong>
            </div>
            <div class="dashboard-card report-card">
              <i class="bi bi-cash-stack"></i><span>ACTIVE SESSION VALUE</span
              ><strong id="reportValue">GHS 0.00</strong>
            </div>
            <div class="dashboard-card report-card">
              <i class="bi bi-p-square-fill"></i><span>AVAILABLE SPACES</span
              ><strong id="reportAvailable">100</strong>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/parking-data.js"></script>
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-pages.js"></script>
  </body>
</html>
